[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-api"
version = "0.1.0"
description = "BIRD Twitcher Mode FastAPI backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.121,<0.122",
  "uvicorn[standard]>=0.43,<0.44",
  "pydantic>=2.13,<2.14"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

